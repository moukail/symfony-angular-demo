<div class="header-container">
  <h1 class="mat-h1 header-title">Streams</h1>
  <div class="header-actions">
    <button mat-button routerLink="/channels" style="margin-right: 8px;">
      <mat-icon>arrow_back</mat-icon> Back to Channels
    </button>
    <button mat-mini-fab color="primary" [routerLink]="['/channels', store.channelId(), 'streams', 'new']">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>

<div class="mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" class="full-width-table" matSort aria-label="Streams">
    <!-- Mime Type Column -->
    <ng-container matColumnDef="mime_type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Mime Type</th>
      <td mat-cell *matCellDef="let row">{{ row.mime_type }}</td>
    </ng-container>

    <!-- Source Column -->
    <ng-container matColumnDef="source">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Source</th>
      <td mat-cell *matCellDef="let row">{{ row.source }}</td>
    </ng-container>

    <!-- Type Column -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
      <td mat-cell *matCellDef="let row">{{ row.type }}</td>
    </ng-container>

    <!-- URL Column -->
    <ng-container matColumnDef="url">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>URL</th>
      <td mat-cell *matCellDef="let row" class="url-cell">{{ row.url }}</td>
    </ng-container>

    <!-- DRM Column -->
    <ng-container matColumnDef="drm">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>DRM</th>
      <td mat-cell *matCellDef="let row">
        <mat-icon [color]="row.drm ? 'warn' : 'primary'">
          {{ row.drm ? 'lock' : 'lock_open' }}
        </mat-icon>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="id" stickyEnd>
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="warn" (click)="deleteStream(row.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    #paginator
    [length]="store.entities().length"
    [pageIndex]="0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    aria-label="Select page"
  >
  </mat-paginator>
</div>
