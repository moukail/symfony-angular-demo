<div class="header-container">
  <h1 class="mat-h1 header-title">Channels</h1>
  <div class="header-actions">
    <button matMiniFab color="primary" routerLink="/channels/new">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>

<div class="mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" class="full-width-table" matSort aria-label="Elements">

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>
    
    <!-- Type Column -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
      <td mat-cell *matCellDef="let row">{{ row.type }}</td>
    </ng-container>

    <!-- Country Column -->
    <ng-container matColumnDef="country">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Country</th>
      <td mat-cell *matCellDef="let row">{{ row.country }}</td>
    </ng-container>

    <!-- Language Column -->
    <ng-container matColumnDef="language">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Language</th>
      <td mat-cell *matCellDef="let row">{{ row.language }}</td>
    </ng-container>

    <!-- Active Column -->
    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Active</th>
      <td mat-cell *matCellDef="let row">{{ row.active }}</td>
    </ng-container>

    <ng-container matColumnDef="id" stickyEnd>
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button [matMenuTriggerFor]="menu" [matMenuTriggerData]="{channel: row}" aria-label="Example icon-button with a menu">
          <mat-icon>more_vert</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    #paginator
    [length]="store.entities().length"
    [pageIndex]="0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    aria-label="Select page"
  >
  </mat-paginator>

  <mat-menu #menu="matMenu">
  <ng-template matMenuContent let-channel="channel">
    <a mat-menu-item routerLink="/channels/{{channel.id}}">
      <mat-icon>dashboard</mat-icon>
      <span>Details</span>
    </a>
    <a mat-menu-item routerLink="/channels/{{channel.id}}/streams">
      <mat-icon>dns</mat-icon>
      <span>Streams</span>
    </a>
    <a mat-menu-item (click)="channelDialog(channel)">
      <mat-icon>create</mat-icon>
      <span>Edit</span>
    </a>
    <a mat-menu-item (click)="deleteDialog(channel)">
      <mat-icon>delete</mat-icon>
      <span>Delete</span>
    </a>
  </ng-template>
</mat-menu>
</div>
